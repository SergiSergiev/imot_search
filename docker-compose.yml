services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: imot
      POSTGRES_USER: imot
      POSTGRES_PASSWORD: imot
    ports:
      - "5432:5432"
    volumes:
      - imot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  imot_postgres:
